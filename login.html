<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Help Desk - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #edf4fb;
      background: radial-gradient(circle at top right, #102a44, #07111f 45%, #050b14);
    }
    .panel {
      width: 100%;
      max-width: 410px;
      padding: 32px;
      background: #0d1b2a;
      border: 1px solid #23364d;
      border-radius: 16px;
      box-shadow: 0 18px 45px #0004;
    }
    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #35bdf4, #2563eb);
      font-weight: 900;
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 1.4rem; }
    .subtitle { margin: 0 0 24px; text-align: center; color: #91a5bb; }
    .choices { display: flex; gap: 8px; margin-bottom: 24px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      background: #35bdf4;
      color: #05253a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .choices button {
      background: #16283b;
      color: #edf4fb;
      border: 1px solid #23364d;
      font-size: .85rem;
    }
    .choices button[aria-pressed="true"] {
      background: #35bdf4;
      color: #05253a;
    }
    .field { display: grid; gap: 7px; margin-bottom: 18px; }
    label { font-size: .85rem; font-weight: 700; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #23364d;
      border-radius: 10px;
      background: #081522;
      color: #edf4fb;
      font: inherit;
    }
    input:focus, select:focus {
      outline: 2px solid #35bdf4;
      outline-offset: 1px;
    }
    .hint { color: #91a5bb; font-size: .8rem; line-height: 1.5; }
    .message { color: #fecdd3; font-size: .85rem; line-height: 1.5; }
    .success { color: #bbf7d0; }
    .hidden { display: none; }
    button:disabled { opacity: .6; cursor: wait; }
    button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="logo" aria-hidden="true">IT</div>
    <h1 id="heading">Help Desk Login</h1>
    <p class="subtitle" id="subtitle">Log in to access support</p>

    <div class="choices" role="group" aria-label="Account options">
      <button id="loginChoice" type="button" aria-pressed="true">Log In</button>
      <button id="signupChoice" type="button" aria-pressed="false">Create Account</button>
    </div>

    <form id="accountForm" autocomplete="off">
      <div id="nameField" class="field hidden">
        <label for="fullName">Full name</label>
        <input id="fullName" autocomplete="off" maxlength="120">
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="off"
          autocapitalize="none" spellcheck="false"
          placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Your personal password</label>
        <input id="password" type="password"
          autocomplete="new-password" required>
      </div>

      <div id="confirmField" class="field hidden">
        <label for="confirmPassword">Confirm personal password</label>
        <input id="confirmPassword" type="password"
          autocomplete="new-password">
        <span class="hint">Use at least 8 characters.</span>
      </div>

      <div class="field">
        <label for="access">Account access</label>
        <select id="access">
          <option value="standard">Standard user</option>
          <option value="technician">Technician</option>
        </select>
        <span id="accessHint" class="hint">
          Existing technicians can sign in without entering an invitation code again.
        </span>
      </div>

      <div id="inviteField" class="field hidden">
        <label for="invitation">Technician invitation code</label>
        <input id="invitation" type="password" autocomplete="new-password">
        <span id="inviteHint" class="hint"></span>
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <button id="submitButton" type="submit">Log In</button>
    </form>

    <noscript>Please enable JavaScript to sign in.</noscript>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://bngvtntshxoxbwrrucfo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_k-5UUaa6YxKk5yDBTftoVA_urPj0M-6';

    const el = id => document.getElementById(id);
    const form = el('accountForm');
    let db;
    let signup = false;
    let busy = false;

    function getClient() {
      if (!window.supabase) {
        throw new Error('The login service could not load. Refresh and try again.');
      }
      if (!db) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return db;
    }

    function clearFields() {
      form.reset();
      ['fullName', 'email', 'password', 'confirmPassword', 'invitation']
        .forEach(id => { el(id).value = ''; });
    }

    function updateAccess() {
      const technician = el('access').value === 'technician';
      el('inviteField').classList.toggle('hidden', !technician);
      el('invitation').required = technician && signup;
      el('invitation').value = '';
      el('inviteHint').textContent = signup
        ? 'An unused invitation is required for new technician access.'
        : 'Leave blank if your account already has technician access.';
      el('accessHint').textContent = technician
        ? 'Technician access is verified securely with Supabase.'
        : 'Standard users request support and view their own tickets.';
    }

    function setMode(create) {
      if (busy) return;
      signup = create;
      clearFields();

      el('heading').textContent = signup
        ? 'Create Your Account' : 'Help Desk Login';
      el('subtitle').textContent = signup
        ? 'Register to request IT support' : 'Log in to access support';
      el('loginChoice').setAttribute('aria-pressed', String(!signup));
      el('signupChoice').setAttribute('aria-pressed', String(signup));
      el('nameField').classList.toggle('hidden', !signup);
      el('confirmField').classList.toggle('hidden', !signup);
      el('fullName').required = signup;
      el('confirmPassword').required = signup;
      el('password').minLength = signup ? 8 : 1;
      el('submitButton').textContent = signup ? 'Create Account' : 'Log In';
      el('message').textContent = '';
      el('message').classList.remove('success');
      updateAccess();
    }

    function setBusy(value) {
      busy = value;
      form.querySelectorAll('input, select, button').forEach(field => {
        field.disabled = value;
      });
      el('loginChoice').disabled = value;
      el('signupChoice').disabled = value;
      el('submitButton').textContent = value
        ? (signup ? 'Creating account...' : 'Logging in...')
        : (signup ? 'Create Account' : 'Log In');
    }

    async function verifyTechnician(client, userId, invitation) {
      const { data, error } = await client
        .from('helpdesk_technicians')
        .select('user_id')
        .eq('user_id', userId)
        .maybeSingle();

      if (error) throw error;
      if (data) return;

      if (!invitation) {
        throw new Error(
          'This account does not have technician access. Enter a valid invitation code or choose Standard user.'
        );
      }

      const result = await client.rpc('redeem_technician_invite', {
        invitation_code: invitation
      });

      if (result.error) throw result.error;
      if (result.data !== true) {
        throw new Error('Technician access could not be verified.');
      }
    }

    el('loginChoice').addEventListener('click', () => setMode(false));
    el('signupChoice').addEventListener('click', () => setMode(true));

    el('access').addEventListener('change', () => {
      updateAccess();
      el('message').textContent = '';
    });

    window.addEventListener('pageshow', () => {
      if (!busy) {
        clearFields();
        updateAccess();
      }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (busy || !form.reportValidity()) return;

      const email = el('email').value.trim();
      const password = el('password').value;
      const fullName = el('fullName').value.trim();
      const invitation = el('invitation').value.trim();
      const technician = el('access').value === 'technician';

      el('message').classList.remove('success');

      if (signup && !fullName) {
        el('message').textContent = 'Please enter your full name.';
        return;
      }
      if (signup && password !== el('confirmPassword').value) {
        el('message').textContent = 'The personal passwords do not match.';
        return;
      }

      setBusy(true);
      el('message').textContent = 'Connecting...';

      let client;
      let authenticated = false;
      let accountCreated = false;

      try {
        client = getClient();
        let result;

        if (signup) {
          result = await client.auth.signUp({
            email,
            password,
            options: {
              data: { full_name: fullName }
            }
          });
        } else {
          result = await client.auth.signInWithPassword({
            email,
            password
          });
        }

        if (result.error) throw result.error;

        if (!result.data.session) {
          if (signup) {
            clearFields();
            updateAccess();
            el('message').classList.add('success');
            el('message').textContent =
              'Registration submitted. If email confirmation is enabled, confirm your email, then log in. For technician access, select Technician and enter your invitation when logging in.';
            return;
          }
          throw new Error('Sign-in did not complete. Please try again.');
        }

        authenticated = true;
        accountCreated = signup;

        if (technician) {
          await verifyTechnician(
            client,
            result.data.user.id,
            invitation
          );
        }

        clearFields();
        window.location.assign('index.html');
      } catch (error) {
        let signOutError;

        if (authenticated && client) {
          const result = await client.auth.signOut({ scope: 'local' });
          signOutError = result.error;
        }

        el('password').value = '';
        el('confirmPassword').value = '';
        el('invitation').value = '';

        let text = error.message || 'Unable to complete your request.';
        if (accountCreated) {
          text += ' Your account was created with standard access. Select Log In to retry technician access or continue as a standard user.';
        }
        if (signOutError) {
          text += ' The session could not be cleared. Please sign out of the tracker before retrying.';
        }
        el('message').textContent = text;
      } finally {
        setBusy(false);
      }
    });

    setMode(false);
  </script>
</body>
</html>
